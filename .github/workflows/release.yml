name: Release
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

defaults:
  run:
    shell: pwsh

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PACKAGE_JSON_PATH: package.json
  GITHUB_BOT_NAME: github-actions[bot]
  GITHUB_BOT_EMAIL: github-actions[bot]@users.noreply.github.com

jobs:
  paths-filter:
    name: Paths Filter
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    outputs:
      package_json: ${{ steps.filter.outputs.package_json }}
    steps:
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            package_json:
              - ${{ env.PACKAGE_JSON_PATH }}

  update-draft:
    name: Update Draft
    if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main') || github.event_name == 'workflow_dispatch'}}
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      tag_name: ${{ steps.release-drafter.outputs.tag_name }}
    steps:
      - uses: release-drafter/release-drafter@563bf132657a13ded0b01fcb723c5a58cdd824e2 # v7.2.1
        id: release-drafter
        with:
          commitish: main

  update-files:
    name: Update Files
    needs: update-draft
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}
      cancel-in-progress: true
    env:
      VERSION: ${{ needs.update-draft.outputs.tag_name }}
      SOURCE_BRANCH: github-actions/update-files/${{ github.run_number }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Update package.json
        run: |
          $packageJson = Get-Content -Raw -Path $env:PACKAGE_JSON_PATH | ConvertFrom-Json
          $packageJson.version = $env:VERSION
          $packageJson | ConvertTo-Json -Depth 100 | Set-Content -Path $env:PACKAGE_JSON_PATH
      - name: Commit package.json
        uses: EndBug/add-and-commit@290ea2c423ad77ca9c62ae0f5b224379612c0321 # v10.0.0
        id: commit-package-json
        with:
          author_name: ${{ env.GITHUB_BOT_NAME }}
          author_email: ${{ env.GITHUB_BOT_EMAIL }}
          message: "Update package.json"
          add: ${{ env.PACKAGE_JSON_PATH }}
          new_branch: ${{ env.SOURCE_BRANCH }}
      - name: Update README.md
        run: |
          Copy-Item -Path .github/DRAFT_README.md -Destination README.md -Force
      - name: Commit README.md
        uses: EndBug/add-and-commit@290ea2c423ad77ca9c62ae0f5b224379612c0321 # v10.0.0
        id: commit-readme
        with:
          author_name: ${{ env.GITHUB_BOT_NAME }}
          author_email: ${{ env.GITHUB_BOT_EMAIL }}
          message: "Update README.md"
          add: "README.md"
          new_branch: ${{ env.SOURCE_BRANCH }}
      - uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v2
        id: create-github-app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Create pull request and merge
        if: ${{ steps.commit-package-json.outputs.committed == 'true' || steps.commit-readme.outputs.committed == 'true' }}
        env:
          GH_TOKEN: ${{ steps.create-github-app-token.outputs.token }}
        run: |
          gh pr create --title "Update files for release" --body "Update files for release" --base main --head $env:SOURCE_BRANCH
          gh pr merge $env:SOURCE_BRANCH --auto --merge

  release:
    name: Release
    needs: [update-draft, paths-filter]
    environment: Release
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}
      cancel-in-progress: false
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.merged && needs.paths-filter.outputs.package_json == 'true' }}
    env:
      VERSION: ${{ needs.update-draft.outputs.tag_name }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
      - name: Validate version in package.json
        run: |
          $packageJson = Get-Content -Raw -Path $env:PACKAGE_JSON_PATH | ConvertFrom-Json
          $packageVersion = $packageJson.version
          if ($packageVersion -ne $env:VERSION) {
            Write-Output "::error::version in package.json ($packageVersion) does not match the release draft tag ($env:VERSION)"
            exit 1
          }
      - uses: release-drafter/release-drafter@563bf132657a13ded0b01fcb723c5a58cdd824e2 # v7.2.1
        id: release-drafter
        with:
          publish: true
          commitish: main
      - name: Get semver
        id: get-semver
        run: |
          $semver = [regex]::Match($env:VERSION, '^([0-9]+)\.([0-9]+)\.([0-9]+)')
          $major = $semver.Groups[1].Value
          $minor = $semver.Groups[2].Value
          $patch = $semver.Groups[3].Value

          @(
            "major=$major"
            "minor=$major.$minor"
            "patch=$major.$minor.$patch"
          ) | Add-Content -Path $env:GITHUB_OUTPUT
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.VERSION }}
      - name: Update major tag
        if: steps.get-semver.outputs.major != '0'
        env:
          MAJOR: ${{ steps.get-semver.outputs.major }}
        run: |
          git push -f origin "refs/tags/${env:VERSION}:refs/tags/${env:MAJOR}"
      - name: Update minor tag
        env:
          MINOR: ${{ steps.get-semver.outputs.minor }}
        run: |
          git push -f origin "refs/tags/${env:VERSION}:refs/tags/${env:MINOR}"
